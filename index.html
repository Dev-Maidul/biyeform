<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="container w-10/12 mx-auto py-5">
      <h1 class="text-xl py-5 font-bold">Biye form</h1>
      <form action="" id="biyeform">
        <input name="name"
          type="text"
          placeholder="Name"
          class="input input-bordered input-secondary w-full max-w-xs"
        />
        <br>
        <br>
        <input name="age"
          type="text"
          placeholder="Age"
          class="input input-bordered input-secondary w-full max-w-xs"
        />
        <br>
        <br>
        <input name="salary"
          type="text"
          placeholder="Salary"
          class="input input-bordered input-secondary w-full max-w-xs"
        />
        <br>
        <br>
        <input name="profession"
          type="text"
          placeholder="Profession"
          class="input input-bordered input-secondary w-full max-w-xs"
        />
        <br>
        <br>
        <button type="submit" class="btn btn-secondary">Check Now</button>
      </form>
      <br>
      <br>
      <h1 id="msg" class="text-2xl font-bold">Hello</h1>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
